<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGPA Claim Status Portal — USC</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #1e3a5f 0%, #234878 100%);
    font-family: 'DM Sans', Arial, sans-serif;
  }

  /* ── LOADER ── */
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    z-index: 2;
    transition: opacity 0.5s cubic-bezier(.16,.8,.24,1),
                filter  0.5s cubic-bezier(.16,.8,.24,1),
                transform 0.5s cubic-bezier(.16,.8,.24,1);
  }
  #loader.loader-hide {
    opacity: 0;
    filter: blur(6px);
    transform: scale(1.03);
    pointer-events: none;
  }

  #loader-mark {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0;
    transform: translateY(10px);
    animation: markIn 0.6s cubic-bezier(.16,.8,.24,1) 0.1s forwards;
  }
  #loader-mark img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
  @keyframes markIn { to { opacity: 1; transform: translateY(0); } }

  #loader-title {
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(8px);
    animation: markIn 0.6s cubic-bezier(.16,.8,.24,1) 0.22s forwards;
  }

  #loader-dots {
    display: flex;
    gap: 6px;
    opacity: 0;
    transform: translateY(8px);
    animation: markIn 0.6s cubic-bezier(.16,.8,.24,1) 0.34s forwards;
  }
  #loader-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #f0c040;
    animation: bounce 1.1s ease-in-out infinite;
  }
  #loader-dots span:nth-child(2) { animation-delay: 0.15s; }
  #loader-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-6px); opacity: 1; } }

  /* ── APP FRAME ── */
  #app-frame {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
    opacity: 0;
    filter: blur(10px);
    transform: scale(1.015) translateY(10px);
    transition: opacity 0.7s cubic-bezier(.16,.8,.24,1),
                filter  0.7s cubic-bezier(.16,.8,.24,1),
                transform 0.7s cubic-bezier(.16,.8,.24,1);
  }
  #app-frame.frame-ready {
    opacity: 1;
    filter: blur(0);
    transform: scale(1) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    #loader, #app-frame, #loader-mark, #loader-title, #loader-dots {
      transition: none !important;
      animation: none !important;
      opacity: 1 !important;
      filter: none !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

  <div id="loader">
    <div id="loader-mark">
      <img src="https://iili.io/CrEw6dP.md.jpg" alt="USC logo">
    </div>
    <div id="loader-title">Loading Claim Status Portal</div>
    <div id="loader-dots"><span></span><span></span><span></span></div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwVKASYEfBfuNT8ndlvlGmXBxlWOkv8O1MN1aa6TQDIBntGzDjdvkrYJUqYyYhrNrVOyg/exec"
    title="SGPA Claim Status Portal"
    allow="clipboard-write"
    onload="revealApp()">
  </iframe>

  <script>
    var revealed = false;
    function revealApp() {
      if (revealed) return;
      revealed = true;
      document.getElementById('app-frame').classList.add('frame-ready');
      var loader = document.getElementById('loader');
      loader.classList.add('loader-hide');
      setTimeout(function () { loader.style.display = 'none'; }, 550);
    }
    // Safety net: if the iframe's onload never fires (slow network, etc.),
    // reveal anyway after 12s rather than leaving the loader stuck forever.
    setTimeout(revealApp, 12000);
  </script>

</body>
</html>
